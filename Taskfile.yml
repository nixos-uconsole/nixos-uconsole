version: "3"

tasks:
  default:
    cmds:
      - task --list-all

  # Image building

  build:
    desc: "Build minimal SD image (native)"
    cmds:
      - nix build .#minimal

  build:cross:
    desc: "Cross-compile minimal SD image from x86_64"
    cmds:
      - nix build .#packages.x86_64-linux.minimal

  # Formatting
  fmt:
    desc: "Formats the repository"
    cmds:
      - treefmt .

  # Hetzner build server
  hetzner:build:
    desc: "Build Go tool for Hetzner builds"
    dir: tools/hetzner-build
    cmds:
      - go build -o hetzner-build .

  hetzner:setup:
    desc: "Spin up Hetzner build server (keeps running)"
    deps: [hetzner:build]
    cmds:
      - ./tools/hetzner-build/hetzner-build --setup-only

  hetzner:release:
    desc: "Run full release on ephemeral Hetzner server"
    deps: [hetzner:build]
    cmds:
      - ./tools/hetzner-build/hetzner-build
